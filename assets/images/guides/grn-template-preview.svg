<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" role="img" aria-labelledby="grnTitle grnDesc">
  <title id="grnTitle">DIXANI Goods Received Note (GRN) Template Preview</title>
  <desc id="grnDesc">Visual preview of the DIXANI Goods Received Note template showing delivery header fields, PO vs. received, accepted, and rejected quantities, batch and expiry columns, and three-stage sign-off.</desc>

  <rect width="920" height="460" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Sheet card -->
  <rect x="24" y="20" width="872" height="420" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Header bar -->
  <rect x="24" y="20" width="872" height="54" rx="10" fill="#0f1f4b"/>
  <rect x="24" y="60" width="872" height="14" fill="#0f1f4b"/>
  <text x="44" y="52" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff">GOODS RECEIVED NOTE (GRN)</text>
  <text x="876" y="51" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#93c5fd">DIXANI WAREHOUSE TEMPLATE</text>

  <!-- Metadata grid -->
  <rect x="44" y="90" width="404" height="84" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="112" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#475569">GRN No:</text>
  <text x="150" y="112" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0f172a">GRN-2026-0418</text>
  <text x="58" y="135" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#475569">Receipt Date:</text>
  <text x="150" y="135" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">28 Nov 2026 · Dock Bay 3</text>
  <text x="58" y="158" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#475569">Supplier:</text>
  <text x="150" y="158" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">Gulf Packaging &amp; Supply Co.</text>

  <rect x="472" y="90" width="404" height="84" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="486" y="112" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#475569">PO Number:</text>
  <text x="592" y="112" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#0f172a">PO-88412</text>
  <text x="486" y="135" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#475569">Delivery Note:</text>
  <text x="592" y="135" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">DN-77194 (Seal #409218 intact)</text>
  <text x="486" y="158" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#475569">Warehouse:</text>
  <text x="592" y="158" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">WH-01 Ambient Staging</text>

  <!-- Table header -->
  <rect x="44" y="190" width="832" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="56" y="210" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">SKU / ITEM</text>
  <text x="275" y="210" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">UOM</text>
  <text x="345" y="210" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">PO QTY</text>
  <text x="420" y="210" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">RECD</text>
  <text x="485" y="210" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">ACCEPTED</text>
  <text x="570" y="210" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">REJECTED</text>
  <text x="652" y="210" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">BATCH / EXPIRY</text>
  <text x="792" y="210" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">DISCREPANCY</text>

  <!-- Row 1 -->
  <rect x="44" y="226" width="832" height="36" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="248" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">PKG-440 · Stretch Film 500mm</text>
  <text x="275" y="248" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#475569">Roll</text>
  <text x="345" y="248" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">240</text>
  <text x="420" y="248" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">240</text>
  <text x="485" y="248" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#15803d">240</text>
  <text x="570" y="248" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#475569">0</text>
  <text x="652" y="248" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#475569">B-2611A · N/A</text>
  <text x="792" y="248" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#15803d">None</text>

  <!-- Row 2 -->
  <rect x="44" y="262" width="832" height="36" fill="#fffbeb" stroke="#fde68a"/>
  <text x="56" y="284" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">BOX-112 · Corrugated Carton</text>
  <text x="275" y="284" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#475569">Pack</text>
  <text x="345" y="284" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">100</text>
  <text x="420" y="284" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">98</text>
  <text x="485" y="284" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#15803d">95</text>
  <text x="570" y="284" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#b45309">3</text>
  <text x="652" y="284" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#475569">B-2610C · N/A</text>
  <text x="792" y="284" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#b45309">-2 Short / 3 Dmg</text>

  <!-- Row 3 -->
  <rect x="44" y="298" width="832" height="36" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="320" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">LBL-085 · Thermal Barcode Labels</text>
  <text x="275" y="320" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#475569">Box</text>
  <text x="345" y="320" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">60</text>
  <text x="420" y="320" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#0f172a">60</text>
  <text x="485" y="320" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#15803d">60</text>
  <text x="570" y="320" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#475569">0</text>
  <text x="652" y="320" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#475569">L-9921 · 11/2028</text>
  <text x="792" y="320" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#15803d">None</text>

  <!-- Sign-off strip -->
  <rect x="44" y="354" width="264" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="376" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#2563eb">RECEIVED BY (DOCK)</text>
  <text x="58" y="398" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#334155">Name / Signature / Time</text>

  <rect x="328" y="354" width="264" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="342" y="376" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#2563eb">CHECKED BY (QA / INVENTORY)</text>
  <text x="342" y="398" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#334155">Blind Count &amp; Damage Hold</text>

  <rect x="612" y="354" width="264" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="626" y="376" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#2563eb">APPROVED BY (SUPERVISOR)</text>
  <text x="626" y="398" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#334155">GRN Release to Put-Away</text>
</svg>
